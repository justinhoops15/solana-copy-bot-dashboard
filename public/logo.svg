<svg xmlns="http://www.w3.org/2000/svg"
  width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background: purple-center, dark edges, teal accent top-right -->
    <radialGradient id="bgA" cx="38%" cy="32%" r="62%">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="48%"  stop-color="#2e1870"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <radialGradient id="bgB" cx="72%" cy="22%" r="55%">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <!-- Orb 1: teal, top-right -->
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <!-- Orb 2: violet, lower-left -->
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filter for chart line -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="clip">
      <rect width="512" height="512" rx="90"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Base fill -->
    <rect width="512" height="512" fill="#050508"/>
    <!-- Purple radial -->
    <rect width="512" height="512" fill="url(#bgA)"/>
    <!-- Teal accent overlay -->
    <rect width="512" height="512" fill="url(#bgB)"/>

    <!-- Orb 1: teal glow, top-right -->
    <ellipse cx="379" cy="113"
      rx="225" ry="195"
      fill="url(#orb1)" opacity="0.85"/>

    <!-- Orb 2: violet glow, lower-left -->
    <ellipse cx="118" cy="358"
      rx="195" ry="164"
      fill="url(#orb2)" opacity="0.75"/>

    <!-- Chart glow (teal haze behind line) -->
    <polyline points="61.4,277.5 131.5,327.7 201.5,241.7 256.0,299.0 318.3,205.8 380.5,263.2 450.6,177.2"
      fill="none" stroke="#22d3ee" stroke-width="61.4"
      stroke-linecap="round" stroke-linejoin="round"
      opacity="0.22" filter="url(#glow)"/>

    <!-- Chart line (crisp white, glow filter) -->
    <polyline points="61.4,277.5 131.5,327.7 201.5,241.7 256.0,299.0 318.3,205.8 380.5,263.2 450.6,177.2"
      fill="none" stroke="#ffffff" stroke-width="28.7"
      stroke-linecap="round" stroke-linejoin="round"
      opacity="0.96" filter="url(#glow)"/>

    
  </g>
</svg>